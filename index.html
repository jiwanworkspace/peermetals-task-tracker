<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerMetals Task Tracker</title>

<style>
:root{
  --bg:#f6f5f1;
  --card:#fff;
  --sidebar:#fbfaf7;
  --text:#171717;
  --muted:#77736b;
  --line:#e7e3da;
  --gold:#c9993f;
  --gold-dark:#9b6d20;
  --gold-soft:#f5ead4;
  --shadow:0 10px 28px rgba(30,25,15,.06);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:235px;
  position:fixed;
  inset:0 auto 0 0;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  padding:28px 22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 6px 30px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(145deg,#d9ae5b,#b98228);
  color:white;
  display:grid;
  place-items:center;
  font-weight:800;
}

.brand-name{
  font-weight:800;
  font-size:16px;
}

.brand-name span{color:var(--gold-dark)}

.brand-sub{
  font-size:8px;
  letter-spacing:3px;
  color:#777;
  margin-top:3px;
}

.calendar-box{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:18px;
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  font-weight:800;
  margin-bottom:12px;
}

.cal-head button{
  border:0;
  background:transparent;
  width:25px;
  height:25px;
  border-radius:50%;
}

.cal-head button:hover{background:#f1eee7}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  text-align:center;
  font-size:9px;
}

.dow{
  color:#888;
  font-weight:700;
}

.cal-day{
  height:23px;
  border:0;
  border-radius:7px;
  background:transparent;
}

.cal-day:hover{background:#f5f1e8}

.cal-day.active{
  background:var(--gold);
  color:white;
  font-weight:800;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  color:#4f4c46;
  font-size:13px;
}

.nav button:hover,
.nav button.active{
  background:var(--gold-soft);
  color:#8b6424;
}

.quote{
  position:absolute;
  left:32px;
  bottom:85px;
  border-left:2px solid #d4a955;
  padding-left:14px;
  color:#99938a;
  font-size:9px;
  letter-spacing:3px;
  line-height:1.8;
}

.main{
  margin-left:235px;
  flex:1;
  padding:30px 38px 70px;
}

.wrap{
  max-width:1090px;
  margin:auto;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:20px;
}

.eyebrow{
  font-size:9px;
  letter-spacing:4px;
  color:#9b968e;
  text-transform:uppercase;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:36px;
  letter-spacing:-1.8px;
}

.month-label{
  font-size:9px;
  letter-spacing:4px;
  color:#99938a;
}

.date-nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:7px;
  margin-bottom:18px;
  scrollbar-width:none;
}

.date-nav::-webkit-scrollbar{display:none}

.date-btn{
  min-width:56px;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:white;
  color:#444;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}

.date-btn strong{font-size:12px}

.date-btn span{
  font-size:9px;
  color:#777;
  margin-top:3px;
}

.date-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:white;
}

.date-btn.active span{color:white}

.progress-card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px 23px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:22px;
}

.progress-ring{
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(var(--gold) 0deg,#e6e3dd 0deg);
  position:relative;
  flex:0 0 auto;
}

.progress-ring:after{
  content:"";
  position:absolute;
  inset:7px;
  background:white;
  border-radius:50%;
}

.progress-ring span{
  position:relative;
  z-index:1;
  font-size:13px;
  font-weight:800;
}

.progress-info{flex:1}

.progress-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.bar{
  height:8px;
  background:#e7e5e1;
  border-radius:99px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0;
  background:var(--gold);
  transition:.2s;
}

.motivation{
  background:var(--gold-soft);
  color:#8a6323;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px 22px;
  box-shadow:var(--shadow);
}

.weekend{
  grid-column:1/-1;
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  font-weight:800;
}

.section-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900;
}

.twitter .section-icon{
  background:#e8f0ff;
  color:#1476d4;
}

.youtube .section-icon{
  background:#fff0f1;
  color:#e31b23;
}

.feed .section-icon{
  background:#e6f7f3;
  color:#18977f;
}

.emails .section-icon{
  background:#efefff;
  color:#665ce8;
}

.weekend .section-icon{
  background:var(--gold-soft);
  color:#9a6d20;
}

.section-count{
  font-size:10px;
  color:#888;
}

.weekend-note{
  font-size:11px;
  color:#777;
  margin-top:-5px;
  margin-bottom:12px;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:32px;
  padding:3px 0;
}

.check{
  width:17px;
  height:17px;
  appearance:none;
  border:1.5px solid #bbb8b0;
  border-radius:3px;
  background:white;
  flex:0 0 auto;
  position:relative;
}

.check:checked{
  background:#222;
  border-color:#222;
}

.check:checked:after{
  content:"✓";
  position:absolute;
  left:3px;
  top:-1px;
  color:white;
  font-size:11px;
}

.task.done .task-label{
  text-decoration:line-through;
  color:#aaa;
}

.task-label{
  flex:1;
  font-size:12px;
  line-height:1.3;
}

.content-btn{
  border:1px solid #e3dfd6;
  background:#faf9f6;
  color:#8b6424;
  border-radius:7px;
  padding:4px 7px;
  font-size:9px;
  white-space:nowrap;
}

.content-btn:hover{
  background:var(--gold-soft);
}

.content-btn.has-content{
  background:var(--gold-soft);
  border-color:#e1c995;
  font-weight:700;
}

.reset{
  display:block;
  margin:18px auto 0;
  border:1px solid #dfd8c9;
  background:white;
  border-radius:20px;
  padding:8px 15px;
  font-size:10px;
  color:#625d54;
}

.empty{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:55px;
  text-align:center;
  color:#8d8981;
  box-shadow:var(--shadow);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,.38);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-backdrop.open{display:flex}

.modal{
  width:min(680px,100%);
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
  padding:18px 21px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-size:15px;
  font-weight:800;
}

.modal-sub{
  font-size:10px;
  color:#888;
  margin-top:3px;
}

.close{
  border:0;
  background:#f5f3ee;
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:17px;
  color:#666;
}

.modal-body{padding:18px 21px}

.modal textarea{
  width:100%;
  min-height:330px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  padding:14px;
  resize:vertical;
  outline:none;
  font-size:13px;
  line-height:1.55;
}

.modal textarea:focus{
  border-color:#caa45e;
}

.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.modal-foot button{
  border-radius:9px;
  padding:9px 14px;
  border:1px solid #ddd8cf;
  background:white;
  font-size:11px;
}

.save{
  background:#b98935!important;
  border-color:#b98935!important;
  color:white;
}

.delete-content{
  margin-right:auto;
  color:#a94b3e!important;
}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:white;
  border-radius:10px;
  padding:9px 13px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.firebase-status{
  position:fixed;
  right:18px;
  top:18px;
  z-index:200;
  background:white;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:20px;
  padding:7px 12px;
  font-size:10px;
  color:#777;
}

.firebase-status.online{color:#287a4b}
.firebase-status.error{color:#a94b3e}

@media(max-width:900px){
  .sidebar{display:none}
  .main{
    margin-left:0;
    padding:22px 16px 50px;
  }
  .cards{grid-template-columns:1fr}
  h1{font-size:30px}
  .month-label{display:none}
}

@media(max-width:560px){
  .motivation{display:none}
  .progress-card{align-items:flex-start}
  .task-label{font-size:11px}
  .content-btn{
    font-size:8px;
    padding:4px 6px;
  }
}
</style>
</head>

<body>

<div class="firebase-status" id="firebaseStatus">
  Connecting...
</div>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="brand-mark">▦</div>
    <div>
      <div class="brand-name">Peer<span>Metals</span></div>
      <div class="brand-sub">TASK TRACKER</div>
    </div>
  </div>

  <div class="calendar-box">
    <div class="cal-head">
      <button id="prevMonth">‹</button>
      <span>OCTOBER 2026</span>
      <button id="nextMonth">›</button>
    </div>

    <div class="cal-grid" id="miniCalendar"></div>
  </div>

  <nav class="nav">
    <button class="active" id="todayNav">☼ &nbsp; Today</button>
    <button id="monthNav">▦ &nbsp; This Month</button>
    <button id="progressNav">▥ &nbsp; Progress</button>
    <button id="settingsNav">⚙ &nbsp; Settings</button>
  </nav>

  <div class="quote">
    DISCIPLINE<br>
    BUILDS<br>
    WEALTH
  </div>

</aside>

<main class="main">

<div class="wrap">

  <div class="topline">

    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="pageTitle"></h1>
    </div>

    <div class="month-label">
      — &nbsp; OCTOBER 2026
    </div>

  </div>

  <div class="date-nav" id="dateNav"></div>

  <section class="progress-card">

    <div class="progress-ring" id="progressRing">
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress-info">

      <div class="progress-title" id="progressTitle">
        0 of 0 tasks completed
      </div>

      <div class="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>

    </div>

    <div class="motivation">
      ✦ &nbsp; Keep going!
    </div>

  </section>

  <div id="taskArea"></div>

</div>

</main>

</div>

<!-- CONTENT MODAL -->

<div class="modal-backdrop" id="modalBackdrop">

  <div class="modal">

    <div class="modal-head">

      <div>
        <div class="modal-title" id="modalTitle">
          Add Content
        </div>

        <div class="modal-sub" id="modalSub"></div>
      </div>

      <button class="close" id="closeModal">×</button>

    </div>

    <div class="modal-body">

      <textarea
        id="contentInput"
        placeholder="Paste or write your script, caption, post copy, notes, links, or any content here..."
      ></textarea>

      <div class="modal-foot">

        <button
          class="delete-content"
          id="deleteContent"
        >
          Delete Content
        </button>

        <button id="cancelModal">
          Cancel
        </button>

        <button class="save" id="saveContent">
          Save Content
        </button>

      </div>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>


<script type="module">

/* =========================================================
   FIREBASE
   NO AUTHENTICATION
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyA4KdCgPeKwNkwZXDcyqrzTozZo6WF6ueg",

  authDomain:
    "peermetals-task-tracker.firebaseapp.com",

  databaseURL:
    "https://peermetals-task-tracker-default-rtdb.firebaseio.com",

  projectId:
    "peermetals-task-tracker",

  storageBucket:
    "peermetals-task-tracker.firebasestorage.app",

  messagingSenderId:
    "1026078145792",

  appId:
    "1:1026078145792:web:9abad86c0fbd83b75007e5",

  measurementId:
    "G-YEFX1P0M60"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getDatabase(firebaseApp);


/* =========================================================
   TASK DATA
========================================================= */

const weekdays = {

  twitter:{
    title:"Twitter / X",
    icon:"X",
    cls:"twitter",
    tasks:[
      "Repost Beginner Video",
      "Repost Experienced Stacker Video",
      "1 Educational Post",
      "1 Educational Thread",
      "Reply to Comments",
      "10 Tweets Comments"
    ]
  },

  youtube:{
    title:"YouTube",
    icon:"▶",
    cls:"youtube",
    tasks:[
      "Beginner Video",
      "Experienced Stacker Video",
      "1 Poll",
      "1 Product/Sales Post",
      "Reply to All Comments"
    ]
  },

  feed:{
    title:"Feed",
    icon:"••",
    cls:"feed",
    tasks:[
      "1 Feed Post",
      "2 Feed Post",
      "3 Feed Post",
      "Reply To Previous Day Comment",
      "Send DM If Necessary"
    ]
  },

  emails:{
    title:"Emails",
    icon:"✉",
    cls:"emails",
    tasks:[
      "1 Regular Email"
    ]
  }

};


const weekend = {

  title:"Weekend Email",
  icon:"✉",
  cls:"weekend",

  tasks:[
    "Weekend Email"
  ]

};


/* =========================================================
   OCTOBER 2026
========================================================= */

const dates = [];

for(
  let day=5;
  day<=31;
  day++
){

  dates.push(
    new Date(
      2026,
      9,
      day
    )
  );

}


let selectedKey =
  "2026-10-05";


let taskState = {};

let contentState = {};

let currentContentKey = null;


/* =========================================================
   FIREBASE STATUS
========================================================= */

function firebaseStatus(
  text,
  type=""
){

  const el =
    document.getElementById(
      "firebaseStatus"
    );

  el.textContent = text;

  el.className =
    "firebase-status " + type;

}


/* =========================================================
   DATE FUNCTIONS
========================================================= */

function dateKey(date){

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function dateFromKey(key){

  const [
    y,
    m,
    d
  ] =
    key.split("-").map(Number);

  return new Date(
    y,
    m-1,
    d
  );

}


function longDate(date){

  return date.toLocaleDateString(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric",
      year:"numeric"
    }
  );

}


function isSaturday(date){

  return date.getDay() === 6;

}


function isSunday(date){

  return date.getDay() === 0;

}


/* =========================================================
   SECTION FUNCTIONS
========================================================= */

function sectionsForDate(date){

  if(isSunday(date)){
    return [];
  }

  if(isSaturday(date)){

    return [
      {
        ...weekend,
        id:"weekend"
      }
    ];

  }

  return Object.entries(
    weekdays
  ).map(
    ([id,section])=>({
      ...section,
      id
    })
  );

}


function makeTaskKey(
  date,
  section,
  task
){

  return `${date}__${section}__${task}`;

}


function tasksForDate(key){

  return sectionsForDate(
    dateFromKey(key)
  ).flatMap(
    section =>
      section.tasks.map(
        task =>
          makeTaskKey(
            key,
            section.id,
            task
          )
      )
  );

}


/* =========================================================
   FIREBASE REFERENCES
========================================================= */

const tasksRef =
  ref(
    db,
    "tracker/tasks"
  );

const contentRef =
  ref(
    db,
    "tracker/content"
  );


/* =========================================================
   LOAD DATA
========================================================= */

onValue(
  tasksRef,

  snapshot => {

    const data =
      snapshot.val();

    taskState =
      data &&
      typeof data === "object"
        ? data
        : {};

    firebaseStatus(
      "✓ Firebase connected",
      "online"
    );

    render();

  },

  error => {

    console.error(error);

    firebaseStatus(
      "Firebase read error",
      "error"
    );

  }

);


onValue(
  contentRef,

  snapshot => {

    const data =
      snapshot.val();

    contentState =
      data &&
      typeof data === "object"
        ? data
        : {};

    render();

  },

  error => {

    console.error(error);

    firebaseStatus(
      "Firebase read error",
      "error"
    );

  }

);


/* =========================================================
   SAVE TASKS
========================================================= */

async function saveTasks(){

  try{

    await set(
      tasksRef,
      taskState
    );

    firebaseStatus(
      "✓ Saved",
      "online"
    );

  }catch(error){

    console.error(error);

    firebaseStatus(
      "Firebase save error",
      "error"
    );

    toast(
      "Could not save task"
    );

  }

}


/* =========================================================
   SAVE CONTENT
========================================================= */

async function saveContent(){

  try{

    await set(
      contentRef,
      contentState
    );

    firebaseStatus(
      "✓ Saved",
      "online"
    );

  }catch(error){

    console.error(error);

    firebaseStatus(
      "Firebase save error",
      "error"
    );

    toast(
      "Could not save content"
    );

  }

}


/* =========================================================
   MINI CALENDAR
========================================================= */

function renderMiniCalendar(){

  const el =
    document.getElementById(
      "miniCalendar"
    );

  const heads=[
    "M","T","W","T","F","S","S"
  ];

  let html =
    heads.map(
      h =>
        `<div class="dow">${h}</div>`
    ).join("");

  const first =
    new Date(
      2026,
      9,
      1
    );

  const offset =
    (first.getDay()+6)%7;

  for(
    let i=0;
    i<offset;
    i++
  ){

    html += "<div></div>";

  }

  for(
    let day=1;
    day<=31;
    day++
  ){

    const date =
      new Date(
        2026,
        9,
        day
      );

    const key =
      dateKey(date);

    html += `

      <button
        class="cal-day ${
          key === selectedKey
            ? "active"
            : ""
        }"
        data-date="${key}"
      >
        ${day}
      </button>

    `;

  }

  el.innerHTML = html;

  el
    .querySelectorAll(".cal-day")
    .forEach(
      button => {

        button.onclick =
          () =>
            selectDate(
              button.dataset.date
            );

      }
    );

}


/* =========================================================
   DATE NAV
========================================================= */

function renderDateNav(){

  const el =
    document.getElementById(
      "dateNav"
    );

  el.innerHTML =
    dates.map(
      date => {

        const key =
          dateKey(date);

        return `

          <button
            class="date-btn ${
              key === selectedKey
                ? "active"
                : ""
            }"
            data-date="${key}"
          >

            <strong>
              ${date.getDate()}
            </strong>

            <span>
              ${
                date.toLocaleDateString(
                  "en-US",
                  {
                    weekday:"short"
                  }
                )
              }
            </span>

          </button>

        `;

      }
    ).join("");

  el
    .querySelectorAll(".date-btn")
    .forEach(
      button => {

        button.onclick =
          () =>
            selectDate(
              button.dataset.date
            );

      }
    );

  const active =
    el.querySelector(
      ".active"
    );

  if(active){

    active.scrollIntoView({
      inline:"center",
      block:"nearest"
    });

  }

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const date =
    dateFromKey(
      selectedKey
    );

  document.getElementById(
    "eyebrow"
  ).textContent =
    date.toLocaleDateString(
      "en-US",
      {
        month:"long",
        day:"numeric",
        year:"numeric"
      }
    ).toUpperCase();

  document.getElementById(
    "pageTitle"
  ).textContent =
    longDate(date);

  renderDateNav();

  renderMiniCalendar();

  renderTasks();

  updateProgress();

}


/* =========================================================
   TASK RENDER
========================================================= */

function renderTasks(){

  const date =
    dateFromKey(
      selectedKey
    );

  const area =
    document.getElementById(
      "taskArea"
    );

  const sections =
    sectionsForDate(date);

  if(!sections.length){

    area.innerHTML = `

      <div class="empty">

        <strong>
          No scheduled tasks.
        </strong>

        <br><br>

        Sunday is intentionally kept clear.

      </div>

    `;

    return;

  }

  area.innerHTML = `

    <div class="cards">

      ${sections.map(
        section => {

          return `

            <section
              class="card ${section.cls}"
            >

              <div class="card-head">

                <div class="section-title">

                  <span class="section-icon">
                    ${section.icon}
                  </span>

                  ${section.title}

                </div>

                <span
                  class="section-count"
                  id="count-${section.id}"
                >
                  0 / ${section.tasks.length}
                </span>

              </div>

              ${
                section.id === "weekend"
                  ? `
                    <div class="weekend-note">
                      Saturday special task —
                      nothing else is scheduled today.
                    </div>
                  `
                  : ""
              }

              <div>

                ${section.tasks.map(
                  task => {

                    const key =
                      makeTaskKey(
                        selectedKey,
                        section.id,
                        task
                      );

                    const checked =
                      !!taskState[key];

                    const hasContent =
                      !!contentState[key];

                    return `

                      <label
                        class="task ${
                          checked
                            ? "done"
                            : ""
                        }"
                      >

                        <input
                          class="check"
                          type="checkbox"
                          data-task="${escapeAttr(key)}"
                          ${
                            checked
                              ? "checked"
                              : ""
                          }
                        >

                        <span class="task-label">
                          ${escapeHtml(task)}
                        </span>

                        <button
                          type="button"
                          class="content-btn ${
                            hasContent
                              ? "has-content"
                              : ""
                          }"
                          data-content="${escapeAttr(key)}"
                        >
                          ${
                            hasContent
                              ? "View Content"
                              : "＋ Content"
                          }
                        </button>

                      </label>

                    `;

                  }
                ).join("")}

              </div>

            </section>

          `;

        }
      ).join("")}

    </div>

    <button
      class="reset"
      id="resetDay"
    >
      ↻ &nbsp; Reset This Day
    </button>

  `;


  /* CHECKBOXES */

  area
    .querySelectorAll(".check")
    .forEach(
      checkbox => {

        checkbox.addEventListener(
          "change",
          async event => {

            const key =
              event.target.dataset.task;

            if(event.target.checked){

              taskState[key] = true;

            }else{

              delete taskState[key];

            }

            updateProgress();

            updateSectionCounts();

            await saveTasks();

          }
        );

      }
    );


  /* CONTENT BUTTONS */

  area
    .querySelectorAll(".content-btn")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            openContent(
              button.dataset.content
            )
        );

      }
    );


  /* RESET */

  document.getElementById(
    "resetDay"
  ).onclick =
    async () => {

      tasksForDate(
        selectedKey
      ).forEach(
        key => {
          delete taskState[key];
        }
      );

      render();

      await saveTasks();

      toast(
        "Day reset"
      );

    };


  updateSectionCounts();

}


/* =========================================================
   SECTION COUNTS
========================================================= */

function updateSectionCounts(){

  const date =
    dateFromKey(
      selectedKey
    );

  sectionsForDate(date)
    .forEach(
      section => {

        const element =
          document.getElementById(
            "count-"+section.id
          );

        if(!element){
          return;
        }

        const done =
          section.tasks.filter(
            task =>
              taskState[
                makeTaskKey(
                  selectedKey,
                  section.id,
                  task
                )
              ]
          ).length;

        element.textContent =
          `${done} / ${section.tasks.length}`;

      }
    );

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const tasks =
    tasksForDate(
      selectedKey
    );

  const total =
    tasks.length;

  const done =
    tasks.filter(
      key =>
        taskState[key]
    ).length;

  const percent =
    total
      ? Math.round(
          done / total * 100
        )
      : 0;

  document.getElementById(
    "progressPercent"
  ).textContent =
    percent+"%";

  document.getElementById(
    "progressTitle"
  ).textContent =
    `${done} of ${total} tasks completed`;

  document.getElementById(
    "barFill"
  ).style.width =
    percent+"%";

  document.getElementById(
    "progressRing"
  ).style.background =
    `conic-gradient(
      var(--gold)
      ${percent * 3.6}deg,
      #e6e3dd 0deg
    )`;

}


/* =========================================================
   SELECT DATE
========================================================= */

function selectDate(key){

  if(
    !dates.some(
      date =>
        dateKey(date) === key
    )
  ){

    return;

  }

  selectedKey =
    key;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   CONTENT MODAL
========================================================= */

function openContent(key){

  currentContentKey =
    key;

  const parts =
    key.split("__");

  const date =
    dateFromKey(
      parts[0]
    );

  const sectionId =
    parts[1];

  const task =
    parts
      .slice(2)
      .join("__");

  const section =
    sectionsForDate(date)
      .find(
        s =>
          s.id === sectionId
      );

  const existing =
    contentState[key] || "";

  document.getElementById(
    "modalTitle"
  ).textContent =
    existing
      ? "Edit Content"
      : "Add Content";

  document.getElementById(
    "modalSub"
  ).textContent =
    `${longDate(date)} · ${
      section
        ? section.title
        : sectionId
    } · ${task}`;

  document.getElementById(
    "contentInput"
  ).value =
    existing;

  document.getElementById(
    "deleteContent"
  ).style.display =
    existing
      ? "block"
      : "none";

  document.getElementById(
    "modalBackdrop"
  ).classList.add(
    "open"
  );

  setTimeout(
    () =>
      document.getElementById(
        "contentInput"
      ).focus(),
    50
  );

}


function closeModal(){

  document.getElementById(
    "modalBackdrop"
  ).classList.remove(
    "open"
  );

  currentContentKey =
    null;

}


/* CLOSE MODAL */

document.getElementById(
  "closeModal"
).onclick =
  closeModal;

document.getElementById(
  "cancelModal"
).onclick =
  closeModal;

document.getElementById(
  "modalBackdrop"
).addEventListener(
  "click",
  event => {

    if(
      event.target.id ===
      "modalBackdrop"
    ){

      closeModal();

    }

  }
);


/* =========================================================
   SAVE CONTENT BUTTON
========================================================= */

document.getElementById(
  "saveContent"
).onclick =
  async () => {

    const value =
      document.getElementById(
        "contentInput"
      ).value.trim();

    if(value){

      contentState[
        currentContentKey
      ] = value;

    }else{

      delete contentState[
        currentContentKey
      ];

    }

    closeModal();

    renderTasks();

    await saveContent();

    toast(
      value
        ? "Content saved"
        : "Content cleared"
    );

  };


/* =========================================================
   DELETE CONTENT
========================================================= */

document.getElementById(
  "deleteContent"
).onclick =
  async () => {

    delete contentState[
      currentContentKey
    ];

    closeModal();

    renderTasks();

    await saveContent();

    toast(
      "Content deleted"
    );

  };


/* =========================================================
   NAVIGATION
========================================================= */

document.getElementById(
  "todayNav"
).onclick =
  () =>
    selectDate(
      "2026-10-05"
    );

document.getElementById(
  "monthNav"
).onclick =
  () =>
    selectDate(
      "2026-10-05"
    );

document.getElementById(
  "progressNav"
).onclick =
  () =>
    toast(
      "Progress is shown for the selected day"
    );

document.getElementById(
  "settingsNav"
).onclick =
  () =>
    toast(
      "No settings are required"
    );

document.getElementById(
  "prevMonth"
).onclick =
  () =>
    toast(
      "Tracker is set for October 2026"
    );

document.getElementById(
  "nextMonth"
).onclick =
  () =>
    toast(
      "Tracker is set for October 2026"
    );


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHtml(value){

  return String(value).replace(
    /[&<>'"]/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[character])
  );

}

function escapeAttr(value){

  return escapeHtml(value);

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  setTimeout(
    () =>
      element.classList.remove(
        "show"
      ),
    1700
  );

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
