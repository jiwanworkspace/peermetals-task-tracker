<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerMetals Task Tracker</title>

<style>

:root{
  --bg:#f6f5f1;
  --panel:#ffffff;
  --sidebar:#fbfaf7;
  --text:#171717;
  --muted:#77736b;
  --line:#e8e5de;
  --gold:#c9993f;
  --gold-dark:#a97825;
  --gold-soft:#f5ead4;
  --shadow:0 12px 30px rgba(32,29,22,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:235px;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  padding:28px 22px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 6px 34px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(145deg,#d9ae5b,#b98228);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:14px;
  box-shadow:0 5px 12px rgba(180,130,45,.2);
}

.brand-name{
  font-weight:800;
  font-size:16px;
  letter-spacing:-.4px;
}

.brand-name span{
  color:var(--gold-dark);
}

.brand-sub{
  font-size:8px;
  letter-spacing:3px;
  color:#77736b;
  margin-top:3px;
}

.calendar-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:18px;
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}

.cal-head button{
  border:0;
  background:transparent;
  color:#777;
  width:24px;
  height:24px;
  border-radius:50%;
}

.cal-head button:hover{
  background:#f1eee7;
}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  text-align:center;
  font-size:9px;
  color:#777;
}

.cal-grid .dow{
  font-weight:700;
  color:#8b877f;
}

.cal-day{
  height:22px;
  display:grid;
  place-items:center;
  border-radius:7px;
  border:0;
  background:transparent;
}

.cal-day.active{
  background:var(--gold);
  color:white;
  font-weight:800;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  color:#4f4c46;
  font-size:13px;
}

.nav button.active,
.nav button:hover{
  background:var(--gold-soft);
  color:#8b6424;
}

.quote{
  position:absolute;
  left:32px;
  bottom:90px;
  border-left:2px solid #d4a955;
  padding-left:14px;
  color:#99938a;
  font-size:9px;
  letter-spacing:3px;
  line-height:1.8;
}

.main{
  margin-left:235px;
  flex:1;
  padding:30px 38px 70px;
}

.wrap{
  max-width:1090px;
  margin:0 auto;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:20px;
}

.eyebrow{
  font-size:9px;
  letter-spacing:4px;
  color:#9b968e;
  text-transform:uppercase;
  margin-bottom:12px;
}

.month-label{
  font-size:9px;
  letter-spacing:4px;
  color:#9b968e;
  margin-top:7px;
}

h1{
  font-size:36px;
  letter-spacing:-1.8px;
  margin:0;
  font-weight:800;
}

.date-nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:6px;
  margin-bottom:18px;
  scrollbar-width:none;
}

.date-nav::-webkit-scrollbar{
  display:none;
}

.date-btn{
  min-width:56px;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:#444;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.1;
  flex:0 0 auto;
}

.date-btn strong{
  font-size:12px;
}

.date-btn span{
  font-size:9px;
  color:#777;
  margin-top:3px;
}

.date-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  box-shadow:0 5px 14px rgba(194,145,56,.22);
}

.date-btn.active span{
  color:#fff;
}

.progress-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px 23px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:22px;
}

.progress-ring{
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(var(--gold) 0deg,#e6e3dd 0deg);
  position:relative;
  flex:0 0 auto;
}

.progress-ring:after{
  content:"";
  position:absolute;
  inset:7px;
  background:#fff;
  border-radius:50%;
}

.progress-ring span{
  position:relative;
  z-index:1;
  font-weight:800;
  font-size:13px;
}

.progress-info{
  flex:1;
}

.progress-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.bar{
  height:8px;
  background:#e7e5e1;
  border-radius:99px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0;
  background:var(--gold);
  border-radius:99px;
  transition:.2s;
}

.motivation{
  background:var(--gold-soft);
  color:#8a6323;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px 22px;
  box-shadow:var(--shadow);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  font-weight:800;
}

.section-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900;
}

.twitter .section-icon{
  background:#e8f0ff;
  color:#1476d4;
}

.youtube .section-icon{
  background:#fff0f1;
  color:#e31b23;
}

.feed .section-icon{
  background:#e6f7f3;
  color:#18977f;
}

.emails .section-icon{
  background:#efefff;
  color:#665ce8;
}

.section-count{
  font-size:10px;
  color:#888;
}

.tasks{
  display:flex;
  flex-direction:column;
  gap:0;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:30px;
  padding:3px 0;
}

.check{
  width:17px;
  height:17px;
  border:1.5px solid #bbb8b0;
  border-radius:3px;
  appearance:none;
  background:#fff;
  flex:0 0 auto;
  position:relative;
}

.check:checked{
  background:#222;
  border-color:#222;
}

.check:checked:after{
  content:"✓";
  color:#fff;
  font-size:11px;
  position:absolute;
  left:3px;
  top:-1px;
}

.task.done .task-label{
  text-decoration:line-through;
  color:#aaa;
}

.task-label{
  font-size:12px;
  line-height:1.3;
  flex:1;
}

.content-btn{
  border:1px solid #e3dfd6;
  background:#faf9f6;
  color:#8b6424;
  border-radius:7px;
  padding:4px 7px;
  font-size:9px;
  white-space:nowrap;
}

.content-btn:hover{
  background:var(--gold-soft);
  border-color:#e1c995;
}

.content-btn.has-content{
  background:#f5ead4;
  border-color:#e1c995;
  font-weight:700;
}

.weekend{
  grid-column:1/-1;
}

.weekend .section-icon{
  background:var(--gold-soft);
  color:#9a6d20;
}

.weekend-card{
  padding-bottom:20px;
}

.weekend-note{
  font-size:11px;
  color:#77736b;
  margin-top:-5px;
  margin-bottom:12px;
}

.reset{
  display:block;
  margin:18px auto 0;
  border:1px solid #dfd8c9;
  background:#fff;
  border-radius:20px;
  padding:8px 15px;
  font-size:10px;
  color:#625d54;
}

.reset:hover{
  background:#faf7ef;
}

.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:55px;
  text-align:center;
  color:#8d8981;
  box-shadow:var(--shadow);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,.38);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(680px,100%);
  background:#fff;
  border-radius:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
  overflow:hidden;
}

.modal-head{
  padding:18px 21px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-weight:800;
  font-size:15px;
}

.modal-sub{
  font-size:10px;
  color:#8a857c;
  margin-top:3px;
}

.close{
  border:0;
  background:#f5f3ee;
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:17px;
  color:#666;
}

.modal-body{
  padding:18px 21px;
}

.modal textarea{
  width:100%;
  min-height:330px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  padding:14px;
  resize:vertical;
  outline:none;
  font-size:13px;
  line-height:1.55;
  color:#222;
}

.modal textarea:focus{
  border-color:#caa45e;
  box-shadow:0 0 0 3px rgba(201,153,63,.1);
}

.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.modal-foot button{
  border-radius:9px;
  padding:9px 14px;
  border:1px solid #ddd8cf;
  background:#fff;
  font-size:11px;
}

.save{
  background:#b98935!important;
  border-color:#b98935!important;
  color:#fff;
}

.delete-content{
  margin-right:auto;
  color:#a94b3e!important;
}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.firebase-status{
  position:fixed;
  right:18px;
  top:18px;
  z-index:200;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:20px;
  padding:7px 12px;
  font-size:10px;
  color:#777;
}

.firebase-status.online{
  color:#287a4b;
}

.firebase-status.error{
  color:#a94b3e;
}

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:22px 16px 50px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  h1{
    font-size:30px;
  }

  .month-label{
    display:none;
  }
}

@media(max-width:560px){

  .progress-card{
    align-items:flex-start;
  }

  .motivation{
    display:none;
  }

  .date-nav{
    margin-right:-16px;
  }

  .card{
    padding:16px;
  }

  .task-label{
    font-size:11px;
  }

  .content-btn{
    font-size:8px;
    padding:4px 6px;
  }

}

</style>
</head>

<script type="module">

/* =========================================================
   FIREBASE
   NO AUTHENTICATION
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyA4KdCgPeKwnNkwZXDcyqrzTozZo6WF6ueg",

  authDomain:
    "peermetals-task-tracker.firebaseapp.com",

  databaseURL:
    "https://peermetals-task-tracker-default-rtdb.firebaseio.com",

  projectId:
    "peermetals-task-tracker",

  storageBucket:
    "peermetals-task-tracker.firebasestorage.app",

  messagingSenderId:
    "1026078145792",

  appId:
    "1:1026078145792:web:9abad86c0fbd83b75007e5",

  measurementId:
    "G-YEFX1P0M60"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================================================
   APP DATA
========================================================= */

const weekdays = {

  twitter: {

    title:'Twitter / X',

    icon:'X',

    cls:'twitter',

    tasks:[

      'Repost Beginner Video',

      'Repost Experienced Stacker Video',

      '1 Educational Post',

      '1 Educational Thread',

      'Reply to Comments',

      '10 Tweets Comments'

    ]

  },

  youtube: {

    title:'YouTube',

    icon:'▶',

    cls:'youtube',

    tasks:[

      'Beginner Video',

      'Experienced Stacker Video',

      '1 Poll',

      '1 Product/Sales Post',

      'Reply to All Comments'

    ]

  },

  feed: {

    title:'Feed',

    icon:'••',

    cls:'feed',

    tasks:[

      '1 Feed Post',

      '2 Feed Post',

      '3 Feed Post',

      'Reply To Previous Day Comment',

      'Send DM If Necessary'

    ]

  },

  emails: {

    title:'Emails',

    icon:'✉',

    cls:'emails',

    tasks:[

      '1 Regular Email'

    ]

  }

};


const weekend = {

  title:'Weekend Email',

  icon:'✉',

  cls:'weekend',

  tasks:[

    'Weekend Email'

  ]

};


const startDate =
  new Date(2026,9,5);

const endDate =
  new Date(2026,9,31);


const dates=[];


for(
  let d=new Date(startDate);
  d<=endDate;
  d.setDate(d.getDate()+1)
){

  dates.push(
    new Date(d)
  );

}


let selectedKey =
  '2026-10-05';

let currentContentKey =
  null;


/* =========================================================
   FIREBASE STATE
========================================================= */

let taskState = {};

let contentState = {};

let firebaseReady = false;


/* =========================================================
   FIREBASE STATUS
========================================================= */

function setFirebaseStatus(
  message,
  type=''
){

  const el =
    document.getElementById(
      'firebaseStatus'
    );

  el.textContent =
    message;

  el.className =
    'firebase-status '+type;

}


/* =========================================================
   DATE HELPERS

   IMPORTANT:
   Uses LOCAL date instead of toISOString()
   to avoid timezone problems.
========================================================= */

function keyForDate(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,'0');

  const day =
    String(
      date.getDate()
    ).padStart(2,'0');

  return `${year}-${month}-${day}`;

}


function dateFromKey(key){

  const [
    y,
    m,
    d
  ] =
    key
      .split('-')
      .map(Number);

  return new Date(
    y,
    m-1,
    d
  );

}


function fmtLong(date){

  return date.toLocaleDateString(
    'en-US',
    {
      weekday:'long',
      month:'long',
      day:'numeric',
      year:'numeric'
    }
  );

}


function isWeekendEmailDay(date){

  return date.getDay()===6;

}


function isSunday(date){

  return date.getDay()===0;

}


/* =========================================================
   TASK HELPERS
========================================================= */

function taskKey(
  dateKey,
  section,
  task
){

  return `${dateKey}__${section}__${task}`;

}


function getSections(date){

  if(
    isSunday(date)
  ){

    return [];

  }


  if(
    isWeekendEmailDay(date)
  ){

    return [

      {
        ...weekend,
        id:'weekend'
      }

    ];

  }


  return Object.entries(
    weekdays
  ).map(
    ([id,s])=>({

      ...s,

      id

    })
  );

}


function getTasks(dateKey){

  return getSections(
    dateFromKey(dateKey)
  ).flatMap(
    s=>
      s.tasks.map(
        t=>
          taskKey(
            dateKey,
            s.id,
            t
          )
      )
  );

}


/* =========================================================
   SAVE ONE TASK
   Does NOT overwrite the whole database.
========================================================= */

async function saveTask(
  tk,
  value
){

  try{

    await set(
      ref(
        db,
        `tracker/tasks/${encodeURIComponent(tk)}`
      ),
      value ? true : null
    );

    setFirebaseStatus(
      '✓ Saved',
      'online'
    );

  }catch(error){

    console.error(
      'Task save error:',
      error
    );

    setFirebaseStatus(
      'Database error',
      'error'
    );

    toast(
      'Could not save task'
    );

  }

}


/* =========================================================
   SAVE ONE CONTENT ITEM
========================================================= */

async function saveContentToFirebase(
  tk,
  value
){

  try{

    await set(
      ref(
        db,
        `tracker/content/${encodeURIComponent(tk)}`
      ),
      value || null
    );

    setFirebaseStatus(
      '✓ Saved',
      'online'
    );

  }catch(error){

    console.error(
      'Content save error:',
      error
    );

    setFirebaseStatus(
      'Database error',
      'error'
    );

    toast(
      'Could not save content'
    );

  }

}


/* =========================================================
   FIREBASE LOAD / REAL-TIME SYNC
========================================================= */

function loadFirebaseData(){

  const tasksRef =
    ref(
      db,
      'tracker/tasks'
    );


  const contentRef =
    ref(
      db,
      'tracker/content'
    );


  onValue(
    tasksRef,
    snapshot=>{

      const data =
        snapshot.val();

      taskState = {};


      if(
        data &&
        typeof data==='object'
      ){

        Object.entries(data)
          .forEach(
            ([encodedKey,value])=>{

              try{

                const key =
                  decodeURIComponent(
                    encodedKey
                  );

                if(value){
                  taskState[key]=true;
                }

              }catch(error){

                console.error(
                  'Task decode error:',
                  error
                );

              }

            }
          );

      }


      firebaseReady =
        true;


      setFirebaseStatus(
        '✓ Firebase connected',
        'online'
      );


      render();

    },
    error=>{

      console.error(
        'Tasks Firebase error:',
        error
      );

      firebaseReady =
        false;


      setFirebaseStatus(
        'Database permission error',
        'error'
      );

    }
  );


  onValue(
    contentRef,
    snapshot=>{

      const data =
        snapshot.val();

      contentState = {};


      if(
        data &&
        typeof data==='object'
      ){

        Object.entries(data)
          .forEach(
            ([encodedKey,value])=>{

              try{

                const key =
                  decodeURIComponent(
                    encodedKey
                  );

                if(value){
                  contentState[key]=value;
                }

              }catch(error){

                console.error(
                  'Content decode error:',
                  error
                );

              }

            }
          );

      }


      firebaseReady =
        true;


      setFirebaseStatus(
        '✓ Firebase connected',
        'online'
      );


      render();

    },
    error=>{

      console.error(
        'Content Firebase error:',
        error
      );

      firebaseReady =
        false;


      setFirebaseStatus(
        'Database permission error',
        'error'
      );

    }
  );

}


/* =========================================================
   CALENDAR
========================================================= */

function renderMiniCalendar(){

  const el =
    document.getElementById(
      'miniCalendar'
    );


  const heads=[
    'Mon',
    'Tue',
    'Wed',
    'Thu',
    'Fri',
    'Sat',
    'Sun'
  ];


  el.innerHTML =
    heads
      .map(
        x=>
          `<div class="dow">${x[0]}</div>`
      )
      .join('');


  const first =
    new Date(
      2026,
      9,
      1
    );


  const mondayOffset =
    (first.getDay()+6)%7;


  for(
    let i=0;
    i<mondayOffset;
    i++
  ){

    el.innerHTML +=
      `<div></div>`;

  }


  for(
    let d=1;
    d<=31;
    d++
  ){

    const date =
      new Date(
        2026,
        9,
        d
      );


    const key =
      keyForDate(date);


    el.innerHTML += `

      <button
        class="cal-day ${
          key===selectedKey
            ? 'active'
            : ''
        }"
        data-key="${escapeAttr(key)}"
      >

        ${d}

      </button>

    `;

  }


  el
    .querySelectorAll('.cal-day')
    .forEach(
      b=>
        b.onclick=
          ()=>
            selectDate(
              b.dataset.key
            )
    );

}


/* =========================================================
   DATE NAVIGATION
========================================================= */

function renderDateNav(){

  const el =
    document.getElementById(
      'dateNav'
    );


  el.innerHTML =
    dates
      .map(
        date=>{

          const key =
            keyForDate(date);


          return `

            <button
              class="date-btn ${
                key===selectedKey
                  ? 'active'
                  : ''
              }"
              data-key="${escapeAttr(key)}"
            >

              <strong>
                ${date.getDate()}
              </strong>

              <span>
                ${
                  date.toLocaleDateString(
                    'en-US',
                    {
                      weekday:'short'
                    }
                  )
                }
              </span>

            </button>

          `;

        }
      )
      .join('');


  el
    .querySelectorAll('.date-btn')
    .forEach(
      b=>
        b.onclick=
          ()=>
            selectDate(
              b.dataset.key
            )
    );


  const active =
    el.querySelector(
      '.active'
    );


  if(active){

    active.scrollIntoView({

      inline:'center',

      behavior:'smooth',

      block:'nearest'

    });

  }

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const date =
    dateFromKey(
      selectedKey
    );


  document.getElementById(
    'eyebrow'
  ).textContent =

    date
      .toLocaleDateString(
        'en-US',
        {
          month:'long',
          day:'numeric',
          year:'numeric'
        }
      )
      .toUpperCase();


  document.getElementById(
    'pageTitle'
  ).textContent =
    fmtLong(date);


  renderDateNav();

  renderMiniCalendar();

  renderTasks();

  updateProgress();

}


/* =========================================================
   TASK RENDER
========================================================= */

function renderTasks(){

  const date =
    dateFromKey(
      selectedKey
    );


  const area =
    document.getElementById(
      'taskArea'
    );


  const sections =
    getSections(date);


  if(!sections.length){

    area.innerHTML = `

      <div class="empty">

        <strong>
          No scheduled tasks.
        </strong>

        <br>

        <span>
          Sunday is intentionally kept clear.
        </span>

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="cards">

      ${
        sections
          .map(
            section=>{

              const count =
                section.tasks.length;


              return `

                <section
                  class="card ${
                    section.cls
                  } ${
                    section.id==='weekend'
                      ? 'weekend-card'
                      : ''
                  }"
                >

                  <div class="card-head">

                    <div class="section-title">

                      <span class="section-icon">
                        ${section.icon}
                      </span>

                      ${section.title}

                    </div>

                    <span
                      class="section-count"
                      id="count-${section.id}"
                    >
                      0 / ${count}
                    </span>

                  </div>


                  ${
                    section.id==='weekend'
                    ?

                    `

                      <div class="weekend-note">

                        Saturday special task —
                        nothing else is scheduled today.

                      </div>

                    `

                    :

                    ''
                  }


                  <div class="tasks">

                    ${
                      section.tasks
                        .map(
                          task=>{

                            const tk =
                              taskKey(
                                selectedKey,
                                section.id,
                                task
                              );


                            const checked =
                              !!taskState[tk];


                            const has =
                              !!contentState[tk];


                            return `

                              <label
                                class="task ${
                                  checked
                                    ? 'done'
                                    : ''
                                }"
                                data-task-key="${escapeAttr(tk)}"
                              >

                                <input
                                  class="check"
                                  type="checkbox"
                                  ${
                                    checked
                                      ? 'checked'
                                      : ''
                                  }
                                >

                                <span class="task-label">
                                  ${
                                    escapeHtml(
                                      task
                                    )
                                  }
                                </span>

                                <button
                                  type="button"
                                  class="content-btn ${
                                    has
                                      ? 'has-content'
                                      : ''
                                  }"
                                  data-content-key="${escapeAttr(tk)}"
                                >

                                  ${
                                    has
                                      ? 'View Content'
                                      : '＋ Content'
                                  }

                                </button>

                              </label>

                            `;

                          }
                        )
                        .join('')
                    }

                  </div>

                </section>

              `;

            }
          )
          .join('')
      }

    </div>


    <button
      class="reset"
      id="resetDay"
    >
      ↻ &nbsp; Reset This Day
    </button>

  `;


  area
    .querySelectorAll('.check')
    .forEach(
      cb=>
        cb.addEventListener(
          'change',
          async e=>{

            const tk =
              e.target
                .closest('.task')
                .dataset.taskKey;


            if(
              e.target.checked
            ){

              taskState[tk]=true;

            }else{

              delete taskState[tk];

            }


            updateProgress();

            updateSectionCounts();

            await saveTask(
              tk,
              e.target.checked
            );

          }
        )
    );


  area
    .querySelectorAll('.content-btn')
    .forEach(
      btn=>
        btn.addEventListener(
          'click',
          ()=>openContent(
            btn.dataset.contentKey
          )
        )
    );


  document.getElementById(
    'resetDay'
  ).onclick = async ()=>{

    const tasks =
      getTasks(
        selectedKey
      );


    for(
      const tk of tasks
    ){

      delete taskState[tk];

      await saveTask(
        tk,
        false
      );

    }


    render();

    toast(
      'Day reset'
    );

  };


  updateSectionCounts();

}


/* =========================================================
   SECTION COUNTS
========================================================= */

function updateSectionCounts(){

  const date =
    dateFromKey(
      selectedKey
    );


  getSections(date)
    .forEach(
      s=>{

        const el =
          document.getElementById(
            'count-'+s.id
          );


        if(!el){
          return;
        }


        const done =
          s.tasks.filter(
            t=>
              taskState[
                taskKey(
                  selectedKey,
                  s.id,
                  t
                )
              ]
          ).length;


        el.textContent =
          `${done} / ${s.tasks.length}`;

      }
    );

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const tasks =
    getTasks(
      selectedKey
    );


  const total =
    tasks.length;


  const done =
    tasks.filter(
      t=>
        taskState[t]
    ).length;


  const pct =
    total
      ? Math.round(
          done/total*100
        )
      : 0;


  document.getElementById(
    'progressPercent'
  ).textContent =
    pct+'%';


  document.getElementById(
    'progressTitle'
  ).textContent =
    `${done} of ${total} tasks completed`;


  document.getElementById(
    'barFill'
  ).style.width =
    pct+'%';


  document.getElementById(
    'progressRing'
  ).style.background =

    `conic-gradient(
      var(--gold)
      ${pct*3.6}deg,
      #e6e3dd 0deg
    )`;

}


/* =========================================================
   DATE SELECT
========================================================= */

function selectDate(key){

  if(
    !dates.some(
      d=>
        keyForDate(d)===key
    )
  ){

    return;

  }


  selectedKey =
    key;


  render();


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s).replace(

    /[&<>'"]/g,

    c=>
      ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])

  );

}


function escapeAttr(s){

  return escapeHtml(s);

}


/* =========================================================
   CONTENT MODAL
========================================================= */

function openContent(tk){

  currentContentKey =
    tk;


  const parts =
    tk.split('__');


  const dateKey =
    parts[0];


  const section =
    parts[1];


  const task =
    parts
      .slice(2)
      .join('__');


  const date =
    dateFromKey(
      dateKey
    );


  const sectionObj =
    getSections(date)
      .find(
        s=>
          s.id===section
      );


  document.getElementById(
    'modalTitle'
  ).textContent =

    contentState[tk]
      ? 'Edit Content'
      : 'Add Content';


  document.getElementById(
    'modalSub'
  ).textContent =

    `${fmtLong(date)} · ${
      sectionObj
        ? sectionObj.title
        : section
    } · ${task}`;


  document.getElementById(
    'contentInput'
  ).value =
    contentState[tk] || '';


  document.getElementById(
    'deleteContent'
  ).style.display =

    contentState[tk]
      ? 'block'
      : 'none';


  document.getElementById(
    'modalBackdrop'
  ).classList.add(
    'open'
  );


  setTimeout(

    ()=>
      document
        .getElementById(
          'contentInput'
        )
        .focus(),

    50

  );

}


function closeModal(){

  document.getElementById(
    'modalBackdrop'
  ).classList.remove(
    'open'
  );


  currentContentKey =
    null;

}


document.getElementById(
  'closeModal'
).onclick =
  closeModal;


document.getElementById(
  'cancelModal'
).onclick =
  closeModal;


document.getElementById(
  'modalBackdrop'
).addEventListener(

  'click',

  e=>{

    if(
      e.target.id===
      'modalBackdrop'
    ){

      closeModal();

    }

  }

);


/* =========================================================
   SAVE CONTENT
========================================================= */

document.getElementById(
  'saveContent'
).onclick = async ()=>{

  const val =

    document
      .getElementById(
        'contentInput'
      )
      .value
      .trim();


  if(val){

    contentState[
      currentContentKey
    ] =
      val;

  }else{

    delete contentState[
      currentContentKey
    ];

  }


  const key =
    currentContentKey;


  closeModal();

  renderTasks();

  await saveContentToFirebase(
    key,
    val
  );


  toast(

    val
      ? 'Content saved'
      : 'Content cleared'

  );

};


/* =========================================================
   DELETE CONTENT
========================================================= */

document.getElementById(
  'deleteContent'
).onclick = async ()=>{

  const key =
    currentContentKey;


  delete contentState[
    key
  ];


  closeModal();

  renderTasks();

  await saveContentToFirebase(
    key,
    ''
  );


  toast(
    'Content deleted'
  );

};


/* =========================================================
   TOAST
========================================================= */

function toast(msg){

  const el =
    document.getElementById(
      'toast'
    );


  el.textContent =
    msg;


  el.classList.add(
    'show'
  );


  setTimeout(

    ()=>
      el.classList.remove(
        'show'
      ),

    1700

  );

}


/* =========================================================
   NAV BUTTONS
========================================================= */

document.getElementById(
  'todayNav'
).onclick =
  ()=>selectDate(
    '2026-10-05'
  );


document.getElementById(
  'monthNav'
).onclick =
  ()=>selectDate(
    '2026-10-05'
  );


document.getElementById(
  'progressNav'
).onclick =
  ()=>toast(
    'Progress is shown for the selected day'
  );


document.getElementById(
  'settingsNav'
).onclick =
  ()=>toast(
    'No settings are required for this tracker'
  );


document.getElementById(
  'prevMonth'
).onclick =
  ()=>toast(
    'This tracker is set for October 2026'
  );


document.getElementById(
  'nextMonth'
).onclick =
  ()=>toast(
    'This tracker is set for October 2026'
  );


/* =========================================================
   INITIAL RENDER
========================================================= */

render();


/* =========================================================
   START FIREBASE
========================================================= */

try{

  loadFirebaseData();

}catch(error){

  console.error(
    'Firebase startup error:',
    error
  );


  setFirebaseStatus(
    'Firebase error',
    'error'
  );

}

</script>
