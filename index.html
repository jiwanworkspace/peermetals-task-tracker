<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerMetals Task Tracker</title>

<style>
:root{
  --bg:#f6f5f1;
  --card:#fff;
  --sidebar:#fbfaf7;
  --text:#171717;
  --muted:#77736b;
  --line:#e7e3da;
  --gold:#c9993f;
  --gold-dark:#9b6d20;
  --gold-soft:#f5ead4;
  --shadow:0 10px 28px rgba(30,25,15,.06);
  --danger:#a94b3e;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  display:flex
}

.sidebar{
  width:235px;
  position:fixed;
  inset:0 auto 0 0;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  padding:28px 22px;
  z-index:5
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 6px 30px
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(145deg,#d9ae5b,#b98228);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800
}

.brand-name{
  font-weight:800;
  font-size:16px
}

.brand-name span{
  color:var(--gold-dark)
}

.brand-sub{
  font-size:8px;
  letter-spacing:3px;
  color:#777;
  margin-top:3px
}

.calendar-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:18px
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  font-weight:800;
  margin-bottom:12px
}

.cal-head button{
  border:0;
  background:transparent;
  width:25px;
  height:25px;
  border-radius:50%
}

.cal-head button:hover{
  background:#f1eee7
}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  text-align:center;
  font-size:9px
}

.dow{
  color:#888;
  font-weight:700
}

.cal-day{
  height:23px;
  border:0;
  border-radius:7px;
  background:transparent
}

.cal-day:hover{
  background:#f5f1e8
}

.cal-day.active{
  background:var(--gold);
  color:#fff;
  font-weight:800
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  color:#4f4c46;
  font-size:13px
}

.nav button:hover,
.nav button.active{
  background:var(--gold-soft);
  color:#8b6424
}

.quote{
  position:absolute;
  left:32px;
  bottom:85px;
  border-left:2px solid #d4a955;
  padding-left:14px;
  color:#99938a;
  font-size:9px;
  letter-spacing:3px;
  line-height:1.8
}

.main{
  margin-left:235px;
  flex:1;
  padding:30px 38px 70px
}

.wrap{
  max-width:1090px;
  margin:auto
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:20px
}

.eyebrow{
  font-size:9px;
  letter-spacing:4px;
  color:#9b968e;
  text-transform:uppercase;
  margin-bottom:12px
}

h1{
  margin:0;
  font-size:36px;
  letter-spacing:-1.8px
}

.month-label{
  font-size:9px;
  letter-spacing:4px;
  color:#99938a
}

.date-nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:7px;
  margin-bottom:18px;
  scrollbar-width:none
}

.date-nav::-webkit-scrollbar{
  display:none
}

.date-btn{
  min-width:56px;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:#444;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:0 0 auto
}

.date-btn strong{
  font-size:12px
}

.date-btn span{
  font-size:9px;
  color:#777;
  margin-top:3px
}

.date-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff
}

.date-btn.active span{
  color:#fff
}

.progress-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px 23px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:22px
}

.progress-ring{
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(
    var(--gold) 0deg,
    #e6e3dd 0deg
  );
  position:relative;
  flex:0 0 auto
}

.progress-ring:after{
  content:"";
  position:absolute;
  inset:7px;
  background:#fff;
  border-radius:50%
}

.progress-ring span{
  position:relative;
  z-index:1;
  font-size:13px;
  font-weight:800
}

.progress-info{
  flex:1
}

.progress-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px
}

.bar{
  height:8px;
  background:#e7e5e1;
  border-radius:99px;
  overflow:hidden
}

.bar-fill{
  height:100%;
  width:0;
  background:var(--gold);
  transition:.2s
}

.motivation{
  background:var(--gold-soft);
  color:#8a6323;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:700
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px 22px;
  box-shadow:var(--shadow)
}

.weekend{
  grid-column:1/-1
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  font-weight:800
}

.section-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900
}

.twitter .section-icon{
  background:#e8f0ff;
  color:#1476d4
}

.youtube .section-icon{
  background:#fff0f1;
  color:#e31b23
}

.feed .section-icon{
  background:#e6f7f3;
  color:#18977f
}

.emails .section-icon{
  background:#efefff;
  color:#665ce8
}

.weekend .section-icon{
  background:var(--gold-soft);
  color:#9a6d20
}

.section-count{
  font-size:10px;
  color:#888
}

/* PLATFORM NOTE */

.platform-note{
  background:#fbfaf7;
  border:1px solid #eee8dc;
  border-radius:10px;
  padding:8px 10px;
  margin:0 0 11px;
  display:flex;
  align-items:flex-start;
  gap:8px
}

.platform-note-icon{
  font-size:11px;
  color:var(--gold-dark);
  line-height:1.4
}

.platform-note-text{
  flex:1;
  font-size:10px;
  line-height:1.45;
  color:#6f6a61;
  white-space:pre-wrap;
  word-break:break-word
}

.note-edit{
  border:0;
  background:transparent;
  color:#9b6d20;
  font-size:9px;
  padding:0 2px
}

.note-edit:hover{
  text-decoration:underline
}

.note-placeholder{
  color:#aaa69e!important;
  font-style:italic
}

.weekend-note{
  font-size:11px;
  color:#777;
  margin-top:-5px;
  margin-bottom:12px
}

/* TASKS */

.task{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:32px;
  padding:3px 0
}

.check{
  width:17px;
  height:17px;
  appearance:none;
  border:1.5px solid #bbb8b0;
  border-radius:3px;
  background:#fff;
  flex:0 0 auto;
  position:relative
}

.check:checked{
  background:#222;
  border-color:#222
}

.check:checked:after{
  content:"✓";
  position:absolute;
  left:3px;
  top:-1px;
  color:#fff;
  font-size:11px
}

.task.done .task-label{
  text-decoration:line-through;
  color:#aaa
}

.task-label{
  flex:1;
  font-size:12px;
  line-height:1.3
}

.content-btn{
  border:1px solid #e3dfd6;
  background:#faf9f6;
  color:#8b6424;
  border-radius:7px;
  padding:4px 7px;
  font-size:9px;
  white-space:nowrap
}

.content-btn:hover{
  background:var(--gold-soft)
}

.content-btn.has-content{
  background:var(--gold-soft);
  border-color:#e1c995;
  font-weight:700
}

.reset{
  display:block;
  margin:18px auto 0;
  border:1px solid #dfd8c9;
  background:#fff;
  border-radius:20px;
  padding:8px 15px;
  font-size:10px;
  color:#625d54
}

/* DAY NOTES */

.day-notes{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px 22px;
  box-shadow:var(--shadow)
}

.day-notes-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}

.day-notes-title{
  font-size:15px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:9px
}

.day-notes-sub{
  font-size:10px;
  color:#8a857d
}

.comment-box{
  display:flex;
  gap:9px;
  align-items:flex-end
}

.author-select{
  height:38px;
  border:1px solid #ddd8cf;
  border-radius:9px;
  background:#faf9f6;
  padding:0 10px;
  font-size:10px;
  color:#555
}

.comment-input{
  flex:1;
  min-height:38px;
  max-height:120px;
  resize:vertical;
  border:1px solid #ddd8cf;
  border-radius:9px;
  padding:9px 10px;
  outline:none;
  font-size:11px;
  line-height:1.4
}

.comment-input:focus{
  border-color:#caa45e
}

.comment-post{
  height:38px;
  border:0;
  border-radius:9px;
  background:#b98935;
  color:#fff;
  padding:0 14px;
  font-size:10px;
  font-weight:700
}

.comments{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:14px
}

.comment{
  border:1px solid #eee9df;
  background:#fbfaf7;
  border-radius:10px;
  padding:9px 11px
}

.comment-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:4px
}

.comment-author{
  font-size:10px;
  font-weight:800
}

.comment-time{
  font-size:9px;
  color:#aaa49b
}

.comment-text{
  font-size:11px;
  color:#5f5a52;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word
}

.comment-delete{
  border:0;
  background:transparent;
  color:#a94b3e;
  font-size:9px;
  float:right;
  margin-left:8px
}

.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:55px;
  text-align:center;
  color:#8d8981;
  box-shadow:var(--shadow)
}

/* MODALS */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,.38);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50
}

.modal-backdrop.open{
  display:flex
}

.modal{
  width:min(680px,100%);
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.2)
}

.modal-head{
  padding:18px 21px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center
}

.modal-title{
  font-size:15px;
  font-weight:800
}

.modal-sub{
  font-size:10px;
  color:#888;
  margin-top:3px
}

.close{
  border:0;
  background:#f5f3ee;
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:17px;
  color:#666
}

.modal-body{
  padding:18px 21px
}

.modal textarea{
  width:100%;
  min-height:260px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  padding:14px;
  resize:vertical;
  outline:none;
  font-size:13px;
  line-height:1.55
}

.modal textarea:focus{
  border-color:#caa45e
}

.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px
}

.modal-foot button{
  border-radius:9px;
  padding:9px 14px;
  border:1px solid #ddd8cf;
  background:#fff;
  font-size:11px
}

.save{
  background:#b98935!important;
  border-color:#b98935!important;
  color:#fff
}

.delete-content{
  margin-right:auto;
  color:#a94b3e!important
}

/* TOAST */

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

/* FIREBASE STATUS */

.firebase-status{
  position:fixed;
  right:18px;
  top:18px;
  z-index:200;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:20px;
  padding:7px 12px;
  font-size:10px;
  color:#777
}

.firebase-status.online{
  color:#287a4b
}

.firebase-status.error{
  color:#a94b3e
}

/* MOBILE */

@media(max-width:900px){

  .sidebar{
    display:none
  }

  .main{
    margin-left:0;
    padding:22px 16px 50px
  }

  .cards{
    grid-template-columns:1fr
  }

  h1{
    font-size:30px
  }

  .month-label{
    display:none
  }
}

@media(max-width:560px){

  .motivation{
    display:none
  }

  .progress-card{
    align-items:flex-start
  }

  .task-label{
    font-size:11px
  }

  .content-btn{
    font-size:8px;
    padding:4px 6px
  }

  .comment-box{
    flex-wrap:wrap
  }

  .author-select{
    flex:0 0 100%
  }

  .comment-input{
    flex:1;
    min-width:0
  }

  .comment-post{
    flex:0 0 auto
  }
}
</style>
</head>

<body>

<div class="firebase-status" id="firebaseStatus">
  Connecting...
</div>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="brand-mark">▦</div>

    <div>
      <div class="brand-name">
        Peer<span>Metals</span>
      </div>

      <div class="brand-sub">

<main class="main">

</main>
</div>


<!-- CONTENT MODAL -->

<div class="modal-backdrop" id="modalBackdrop">

  <div class="modal">

    <div class="modal-head">

      <div>

        <div class="modal-title" id="modalTitle">
          Add Content
        </div>

        <div class="modal-sub" id="modalSub"></div>

      </div>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>

    <div class="modal-body">

      <textarea
        id="contentInput"

      ></textarea>

      <div class="modal-foot">

        <button class="delete-content" id="deleteContent">
          Delete Content
        </button>

        <button id="cancelModal">
          Cancel
        </button>

        <button class="save" id="saveContent">
          Save Content
        </button>

      </div>

    </div>

  </div>

</div>


<!-- PLATFORM NOTE MODAL -->

<div class="modal-backdrop" id="noteModalBackdrop">

  <div class="modal">

    <div class="modal-head">

      <div>

        <div class="modal-title" id="noteModalTitle">
          Platform Note
        </div>

        <div class="modal-sub" id="noteModalSub"></div>

      </div>

      <button class="close" id="closeNoteModal">
        ×
      </button>

    </div>

    <div class="modal-body">

      <textarea

      <div class="modal-foot">

          Cancel
        </button>

        <button class="save" id="savePlatformNote">
          Save Note
        </button>

      </div>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>

let taskState = {};
let contentState = {};
let platformNotes = {};
let dayComments = {};

let currentContentKey = null;
let currentPlatformNoteKey = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function firebaseStatus(text,type=""){

  const el = $("firebaseStatus");

  el.textContent = text;

  el.className =
    "firebase-status " + type;

}


function dateKey(date){

  return `${date.getFullYear()}-${String(
    date.getMonth()+1
  ).padStart(2,"0")}-${String(
    date.getDate()
  ).padStart(2,"0")}`;

}


function dateFromKey(key){

  const [y,m,d] =
    key.split("-").map(Number);

  return new Date(y,m-1,d);

}


function longDate(date){

  return date.toLocaleDateString(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric",
      year:"numeric"
    }
  );

}


function isSaturday(date){

  return date.getDay() === 6;

}


function isSunday(date){

  return date.getDay() === 0;

}


function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])

  );

}


function safeKey(value){

  return encodeURIComponent(value);

}


function taskKey(
  dayKey,
  sectionKey,
  task
){

  return `${dayKey}__${sectionKey}__${safeKey(task)}`;

}


function contentKey(
  dayKey,
  sectionKey,
  task
){

  return taskKey(
    dayKey,
    sectionKey,
    task
  );

}


function platformNoteKey(
  dayKey,
  sectionKey
){

  return `${dayKey}__${sectionKey}`;

}


function showToast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      () => el.classList.remove("show"),
      1800
    );

}


/* =========================================================
   MINI CALENDAR
========================================================= */

function renderMiniCalendar(){

  const grid =
    $("miniCalendar");

  grid.innerHTML = "";

  [
    "M","T","W","T","F","S","S"
  ].forEach(d => {

    const el =
      document.createElement("div");

    el.className = "dow";

    el.textContent = d;

    grid.appendChild(el);

  });


  const first =
    new Date(2026,9,1);

  const offset =
    (first.getDay()+6)%7;


  for(
    let i=0;
    i<offset;
    i++
  ){

    grid.appendChild(
      document.createElement("div")
    );

  }


  for(
    let day=1;
    day<=31;
    day++
  ){

    const el =
      document.createElement("button");

    el.className = "cal-day";

    el.textContent = day;

    const key =
      dateKey(
        new Date(2026,9,day)
      );


    if(key === selectedKey){

      el.classList.add("active");

    }


    el.onclick = () => {

      selectedKey = key;

      renderAll();

    };


    grid.appendChild(el);

  }

}


/* =========================================================
   DATE NAVIGATION
========================================================= */

function renderDateNav(){

  const nav =
    $("dateNav");

  nav.innerHTML = "";


  dates.forEach(date => {

    const key =
      dateKey(date);

    const btn =
      document.createElement("button");

    btn.className =
      "date-btn" +
      (key === selectedKey
        ? " active"
        : "");

    btn.innerHTML = `
      <strong>${date.getDate()}</strong>
      <span>
        ${date.toLocaleDateString(
          "en-US",
          {weekday:"short"}
        )}
      </span>
    `;


    btn.onclick = () => {

      selectedKey = key;

      renderAll();

    };


    nav.appendChild(btn);

  });


  requestAnimationFrame(() => {

    document
      .querySelector(".date-btn.active")
      ?.scrollIntoView({
        block:"nearest",
        inline:"center"
      });

  });

}


/* =========================================================
   DAILY SECTIONS
========================================================= */

function getSectionsForDate(date){

  if(isSunday(date)){

    return [];

  }


  if(isSaturday(date)){

    return [weekend];

  }


  return Object.values(weekdays);

}


/* =========================================================
   PROGRESS
========================================================= */

function renderProgress(){

  const sections =
    getSectionsForDate(
      dateFromKey(selectedKey)
    );

  let total = 0;
  let done = 0;


  sections.forEach(section => {

    section.tasks.forEach(task => {

      total++;

      if(
        taskState[
          taskKey(
            selectedKey,
            section.cls,
            task
          )
        ]
      ){

        done++;

      }

    });

  });


  const percent =
    total
      ? Math.round(done/total*100)
      : 0;


  $("progressPercent")
    .textContent =
    percent + "%";


  $("progressTitle")
    .textContent =
    `${done} of ${total} tasks completed`;


  $("barFill")
    .style.width =
    percent + "%";


  $("progressRing")
    .style.background =
    `conic-gradient(
      var(--gold)
      ${percent*3.6}deg,
      #e6e3dd
      ${percent*3.6}deg
    )`;

}


/* =========================================================
   TASK AREA
========================================================= */

function renderTaskArea(){

  const area =
    $("taskArea");

  const date =
    dateFromKey(selectedKey);

  const sections =
    getSectionsForDate(date);


  if(!sections.length){

    area.innerHTML = `
      <div class="empty">
        No scheduled tasks for Sunday.
        <br><br>
        Enjoy the reset.
      </div>
    `;

    return;

  }


  let html =
    '<div class="cards">';


  sections.forEach(section => {

    const noteKey =
      platformNoteKey(
        selectedKey,
        section.cls
      );

    const note =
      platformNotes[noteKey] || "";


    const completed =
      section.tasks.filter(task =>
        taskState[
          taskKey(
            selectedKey,
            section.cls,
            task
          )
        ]
      ).length;


    html += `

      <section class="card ${section.cls}">

        <div class="card-head">

          <div class="section-title">

            <div class="section-icon">
              ${section.icon}
            </div>

            ${section.title}

          </div>

          <div class="section-count">
            ${completed} / ${section.tasks.length}
          </div>

        </div>


        <div class="platform-note">

          <div class="platform-note-icon">
            ✎
          </div>

          <div
            class="platform-note-text ${
              note
                ? ""
                : "note-placeholder"
            }"
          >
            ${escapeHTML(
              note ||
              "Add a small note for this platform..."
            )}
          </div>

          <button
            class="note-edit"
            data-note="${escapeHTML(section.cls)}"
          >
            ${note ? "Edit" : "Add"}
          </button>

        </div>


        ${
          section.cls === "weekend"
            ? `
              <div class="weekend-note">
                Saturday: Weekend Email only.
              </div>
            `
            : ""
        }

    `;


    section.tasks.forEach(task => {

      const tk =
        taskKey(
          selectedKey,
          section.cls,
          task
        );

      const ck =
        contentKey(
          selectedKey,
          section.cls,
          task
        );


      const done =
        !!taskState[tk];


      const has =
        !!(
          contentState[ck] &&
          String(
            contentState[ck]
          ).trim()
        );


      html += `

        <div class="task ${
          done ? "done" : ""
        }">

          <input
            class="check"
            type="checkbox"
            data-task="${escapeHTML(section.cls)}"
            data-name="${escapeHTML(task)}"
            ${done ? "checked" : ""}
          >

          <div class="task-label">
            ${escapeHTML(task)}
          </div>

          <button
            class="content-btn ${
              has ? "has-content" : ""
            }"
            data-content="${escapeHTML(section.cls)}"
            data-name="${escapeHTML(task)}"
          >
            ${has ? "View Content" : "+ Content"}
          </button>

        </div>

      `;

    });


    html += "</section>";

  });


  html += "</div>";

  html += renderDayNotes();

  area.innerHTML = html;


  area
    .querySelectorAll(".check")
    .forEach(input => {

      input.addEventListener(
        "change",
        handleTaskToggle
      );

    });


  area
    .querySelectorAll("[data-content]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          openContent(
            btn.dataset.content,
            btn.dataset.name
          )
      );

    });


  area
    .querySelectorAll("[data-note]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          openPlatformNote(
            btn.dataset.note
          )
      );

    });


  $("postComment")
    ?.addEventListener(
      "click",
      postComment
    );


  area
    .querySelectorAll(".comment-delete")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          deleteComment(
            btn.dataset.comment
          )
      );

    });

}


/* =========================================================
   DAY NOTES
========================================================= */

function renderDayNotes(){

  const comments =
    dayComments[selectedKey] || {};


  const entries =
    Object.entries(comments)
      .sort(
        (a,b) =>
          (a[1]?.createdAt || 0) -
          (b[1]?.createdAt || 0)
      );


  return `

    <section class="day-notes">

      <div class="day-notes-head">

        <div class="day-notes-title">
          📝 Day Notes
        </div>

        <div class="day-notes-sub">
          ${longDate(
            dateFromKey(selectedKey)
          )}
        </div>

      </div>


      <div class="comment-box">

        <select
          class="author-select"
          id="commentAuthor"
        >

          <option value="Me">
            Me
          </option>

          <option value="Founder">
            Founder
          </option>

        </select>


        <textarea
          class="comment-input"
          id="commentInput"
          placeholder="Add a note or comment for this day..."
        ></textarea>


        <button
          class="comment-post"
          id="postComment"
        >
          Post
        </button>

      </div>


      <div class="comments">

        ${entries.map(
          ([id,c]) => `

            <div class="comment">

              <div class="comment-top">

                <span class="comment-author">
                  ${escapeHTML(
                    c.author || "Me"
                  )}
                </span>

                <span class="comment-time">
                  ${formatTime(
                    c.createdAt
                  )}
                </span>

              </div>


              <button
                class="comment-delete"
                data-comment="${escapeHTML(id)}"
              >
                Delete
              </button>


              <div class="comment-text">
                ${escapeHTML(
                  c.text || ""
                )}
              </div>

            </div>

          `
        ).join("")}

      </div>

    </section>

  `;

}


function formatTime(ts){

  if(!ts) return "";

  return new Date(ts)
    .toLocaleString(
      "en-US",
      {
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   SAVE TASK
========================================================= */

async function handleTaskToggle(e){

  const section =
    e.currentTarget.dataset.task;

  const task =
    e.currentTarget.dataset.name;


  const key =
    taskKey(
      selectedKey,
      section,
      task
    );


  try{

    await set(
      ref(
        db,
        `tracker/tasks/${safeKey(key)}`
      ),

      e.currentTarget.checked
        ? true
        : null
    );


    showToast(
      e.currentTarget.checked
        ? "Task completed"
        : "Task reopened"
    );

  }
  catch(err){

    console.error(err);

    e.currentTarget.checked =
      !e.currentTarget.checked;

    firebaseStatus(
      "Database error",
      "error"
    );

    showToast(
      "Could not save task"
    );

  }

}


/* =========================================================
   CONTENT
========================================================= */

function openContent(
  section,
  task
){

  currentContentKey =
    contentKey(
      selectedKey,
      section,
      task
    );


  $("modalTitle")
    .textContent =
    contentState[
      currentContentKey
    ]
      ? "View Content"
      : "Add Content";


  $("modalSub")
    .textContent =
    `${sectionTitle(section)} · ${task} · ${selectedKey}`;


  $("contentInput")
    .value =
    contentState[
      currentContentKey
    ] || "";


  $("modalBackdrop")
    .classList
    .add("open");


  setTimeout(
    () =>
      $("contentInput").focus(),
    50
  );

}


function sectionTitle(cls){

  return [
    ...Object.values(weekdays),
    weekend
  ].find(
    s => s.cls === cls
  )?.title || cls;

}


function closeContentModal(){

  currentContentKey = null;

  $("modalBackdrop")
    .classList
    .remove("open");

}


async function saveContent(){

  if(!currentContentKey)
    return;


  const value =
    $("contentInput")
      .value
      .trim();


  try{

    await set(
      ref(
        db,
        `tracker/content/${safeKey(currentContentKey)}`
      ),

      value || null
    );


    closeContentModal();

    showToast(
      value
        ? "Content saved"
        : "Content cleared"
    );

  }
  catch(err){

    console.error(err);

    firebaseStatus(
      "Database error",
      "error"
    );

    showToast(
      "Could not save content"
    );

  }

}


async function deleteContent(){

  if(!currentContentKey)
    return;


  try{

    await set(
      ref(
        db,
        `tracker/content/${safeKey(currentContentKey)}`
      ),
      null
    );


    closeContentModal();

    showToast(
      "Content deleted"
    );

  }
  catch(err){

    console.error(err);

    showToast(
      "Could not delete content"
    );

  }

}

/* =========================================================
   DAY COMMENTS
========================================================= */

async function postComment(){

  const input =
    $("commentInput");

  const author =
    $("commentAuthor")
      ?.value || "Me";

  const text =
    input?.value.trim();


  if(!text){

    showToast(
      "Write a note first"
    );

    return;

  }


  try{

    const newRef =
      push(
        ref(
          db,
          `tracker/dayNotes/${selectedKey}`
        )
      );


    await set(
      newRef,
      {
        author,
        text,
        createdAt:Date.now()
      }
    );


    showToast(
      "Day note posted"
    );

  }
  catch(err){

    console.error(err);

    firebaseStatus(
      "Database error",
      "error"
    );

    showToast(
      "Could not post note"
    );

  }

}


async function deleteComment(id){

  try{

    await set(
      ref(
        db,
        `tracker/dayNotes/${selectedKey}/${safeKey(id)}`
      ),
      null
    );


    showToast(
      "Comment deleted"
    );

  }
  catch(err){

    console.error(err);

    showToast(
      "Could not delete comment"
    );

  }

}


/* =========================================================
   HEADER
========================================================= */

  const date =
    dateFromKey(selectedKey);


  $("eyebrow")
    .textContent =
    date
      .toLocaleDateString(
        "en-US",
        {
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      )
      .toUpperCase();


  $("pageTitle")
    .textContent =
    longDate(date);

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll(){

  renderHeader();

  renderDateNav();

  renderMiniCalendar();

  renderProgress();

  renderTaskArea();

}


/* =========================================================
   FIREBASE REAL-TIME LISTENERS
========================================================= */

function listenFirebase(){

  firebaseStatus(
    "Connecting..."
  );


  /* TASKS */

  onValue(
    ref(db,"tracker/tasks"),

    snap => {

      taskState = {};

      const data =
        snap.val() || {};


      Object.entries(data)
        .forEach(
          ([k,v]) => {

            if(v){

              taskState[
                decodeURIComponent(k)
              ] = true;

            }

          }
        );


      renderAll();

      firebaseStatus(
        "✓ Firebase connected",
        "online"
      );

    },

    err => {

      console.error(err);

      firebaseStatus(
        "Firebase error",
        "error"
      );

    }

  );


  /* CONTENT */

  onValue(
    ref(db,"tracker/content"),

    snap => {

      contentState = {};

      const data =
        snap.val() || {};


      Object.entries(data)
        .forEach(
          ([k,v]) => {

            if(
              v !== null &&
              v !== ""
            ){

              contentState[
                decodeURIComponent(k)
              ] = v;

            }

          }
        );


      renderAll();

    },

    err =>
      console.error(err)

  );


  /* PLATFORM NOTES */

  onValue(
    ref(db,"tracker/platformNotes"),

    snap => {

      platformNotes = {};

      const data =
        snap.val() || {};


      Object.entries(data)
        .forEach(
          ([k,v]) => {

            if(v){

              platformNotes[
                decodeURIComponent(k)
              ] = v;

            }

          }
        );


      renderAll();

    },

    err =>
      console.error(err)

  );


  /* DAY NOTES */

  onValue(
    ref(db,"tracker/dayNotes"),

    snap => {

      dayComments = {};

      const data =
        snap.val() || {};


      Object.entries(data)
        .forEach(
          ([day,comments]) => {

            dayComments[day] =
              comments || {};

          }
        );


      renderAll();

    },

    err =>
      console.error(err)

  );

}

/* =========================================================
   RESET DAY
========================================================= */

$("resetDay").onclick =
  async () => {

    if(
      !confirm(
        `Reset all tasks for ${longDate(
          dateFromKey(selectedKey)
        )}?`
      )
    ){

      return;

    }


    try{

      for(
        const s of
        getSectionsForDate(
          dateFromKey(selectedKey)
        )
      ){

        for(
          const task of s.tasks
        ){

          await set(
            ref(
              db,
              `tracker/tasks/${safeKey(
                taskKey(
                  selectedKey,
                  s.cls,
                  task
                )
              )}`
            ),
            null
          );

        }

      }


      showToast(
        "Day reset"
      );

    }
    catch(err){

      console.error(err);

      showToast(
        "Could not reset day"
      );

    }

  };
